syntax = "proto3";
package property;

import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

option go_package = "main/proto";

service PropertyService {
  rpc CreateProperty (CreatePropertyRequest)  returns (CreatePropertyResponse);
  rpc UpdateProperty (UpdatePropertyRequest)  returns (UpdatePropertyResponse);
  rpc DeleteProperty (DeletePropertyRequest)  returns (DeletePropertyResponse);
  rpc GetProperty    (GetPropertyRequest)     returns (GetPropertyResponse);
  rpc ListProperties (ListPropertiesRequest)  returns (ListPropertiesResponse);
  rpc CountProperties(CountPropertiesRequest) returns (CountPropertiesResponse);
}

message Property {
  int64           id          = 1;
  int64           user_id     = 2;
  string          name        = 3;
  string          description = 4;
  string          address     = 5;
  int64           price       = 6;
  Location        location    = 7;
  repeated string image_urls  = 8;
}

message Location {
  float lat  = 1;
  float long = 2;
}

message CreatePropertyRequest {
  int64           user_id     = 1;
  string          name        = 2;
  string          description = 3;
  string          address     = 4;
  int64           price       = 5;
  Location        location    = 6;
  repeated string image_urls  = 7;
}

message CreatePropertyResponse {
  Property property = 1;
}

message UpdatePropertyRequest{
  Property                  property   = 1;
  google.protobuf.FieldMask field_mask = 2;
}

message UpdatePropertyResponse {
  Property property = 1;
}

message DeletePropertyRequest{
  int64 id = 1;
}

message DeletePropertyResponse {

}

message GetPropertyRequest {
  int64 id = 1;
}

message GetPropertyResponse {
  Property property = 1;
}

message ListPropertiesRequest {
  string                              next_page_token = 1;
  int64                               page_size       = 2;
  repeated ListPropertiesFiltersOneOf filters         = 3;
}

message ListPropertiesFiltersOneOf {
  oneof filter {
    FilterByOwner      owner       = 1;
    FilterByName       name        = 2;
    FilterByLocation   location    = 3;
    FilterByPriceRange price_range = 4;
  }
}

message FilterByName {
  string value = 1;
}

message FilterByLocation {
  Location center = 1;
  float    radius = 2;
}

message FilterByOwner {
  int64 value = 1;
}

message FilterByPriceRange {
  int64 min = 1;
  int64 max = 2;
}

message ListPropertiesResponse {
  string            next_page_token = 1;
  repeated Property properties      = 2;
}

message CountPropertiesRequest {
  repeated ListPropertiesFiltersOneOf filters = 1;
}

message CountPropertiesResponse {
  int64 count = 1;
}
