syntax = "proto3";
package friendrequestbase;

import "google/protobuf/timestamp.proto";
import "common/google/api/annotations.proto";


option go_package = "main/proto";

service FriendRequestService {
    rpc FriendRequestEndpoint (CreateFriendRequestRequest) returns (CreateFriendRequestResponse){
        option (google.api.http) = {
            post: "/friendrequest"
            body: "*"
        };
      }
} 

message FriendRequest {
  int64 id = 1;
  string sender_id = 2;
  string receiver_id = 3;   
  RequestStatus status = 4;  // ENUM: 'pending', 'accepted', 'rejected'
  google.protobuf.Timestamp created_at = 5;
}

enum RequestStatus {
  STATUS_UNKNOWN = 0;
  STATUS_PENDING = 1; // mapped to 1 in the db
  STATUS_ACCEPTED = 2; // mapped to 2 in the db
  STATUS_REJECTED = 3; // mapped to 3 in the db
}

message CreateFriendRequestRequest {
  string sender_id = 1;
  string receiver_id = 2;
}

message CreateFriendRequestResponse {
  FriendRequest request = 1;
}