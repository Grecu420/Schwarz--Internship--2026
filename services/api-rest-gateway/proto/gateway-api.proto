syntax = "proto3";
package gateway;

import "user-base/proto/user-api.proto";
import "friend-request-base/proto/friend-request-api.proto";
import "auth-base/proto/auth-api.proto";
import "message-base/proto/message-api.proto";
import "conversation-base/proto/conversation-api.proto";
import "property-base/proto/property-api.proto";

import "common/google/api/annotations.proto";

option go_package = "main/proto";

service GatewayService {
  rpc CreateUser(userbase.CreateUserRequest) returns (userbase.CreateUserResponse){
    option (google.api.http) = {
      post: "/user"
      body: "*"
    };
  }

  rpc GetUser(userbase.GetUserRequest) returns (userbase.GetUserResponse){
    option (google.api.http) = {
      get: "/user" // query on email
    };
  }

  rpc CreateFriendRequest (friendrequestbase.CreateFriendRequestRequest) returns (friendrequestbase.CreateFriendRequestResponse){
    option (google.api.http) = {
      post: "/friend-request"
      body: "*"
    };
  }

  rpc UpdateFriendRequest (friendrequestbase.UpdateFriendRequestRequest) returns (friendrequestbase.UpdateFriendRequestResponse){
    option (google.api.http) = {
      patch: "/friend-request"
      body : "*"
    };
  }

  rpc ListFriendRequests (friendrequestbase.ListFriendRequestsRequest) returns (friendrequestbase.ListFriendRequestsResponse){
    option (google.api.http) = {
      post: "/friend-request-list"
      body: "*"
    };
  }

  rpc Login(auth.LoginRequest) returns (auth.LoginResponse) {
    option (google.api.http) = {
      post: "/login"
      body: "*"
    };
  }

  rpc ListUsers (userbase.ListUsersRequest) returns (userbase.ListUsersResponse) {
    option (google.api.http) = {
      post: "/list-users"
      body: "*"
    };
  }

  rpc CreateMessage(messagebase.CreateMessageRequest) returns (messagebase.CreateMessageResponse){
    option (google.api.http) = {
      post: "/message"
      body: "*"
    };
  }

  rpc ListMessages(messagebase.ListMessagesRequest) returns (messagebase.ListMessagesResponse) {
    option (google.api.http) = {
      get: "/message" // query on conversation_id
    };
  }

  rpc CreateConversation (conversation.CreateConversationRequest) returns (conversation.CreateConversationResponse) {
    option (google.api.http) = {
      post: "/conversations"
      body: "*"
    };
  }

  rpc ListConversations (conversation.ListConversationsRequest) returns (conversation.ListConversationsResponse) {
    option (google.api.http) = {
      get: "/conversations"
    };
  }

  rpc CreateProperty (property.CreatePropertyRequest) returns (property.CreatePropertyResponse) {
    option (google.api.http) = {
      post: "/property"
      body: "*"
    };
  }

  rpc UpdateProperty (property.UpdatePropertyRequest) returns (property.UpdatePropertyResponse) {
    option (google.api.http) = {
      patch: "/property"
      body : "*"
    };
  }

  rpc DeleteProperty (property.DeletePropertyRequest) returns (property.DeletePropertyResponse) {
    option (google.api.http) = {
      delete: "/property" // query on id
    };
  }

  rpc GetProperty (property.GetPropertyRequest) returns (property.GetPropertyResponse) {
    option (google.api.http) = {
      get: "/property" // query on id
    };
  }

  rpc ListProperties (property.ListPropertiesRequest) returns (property.ListPropertiesResponse) {
    option (google.api.http) = {
      post: "/propertyList"
      body: "*"
    };
  }
}
