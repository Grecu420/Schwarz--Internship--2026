
services:

  api-rest-gateway:
    build:
      context: .
      dockerfile: services/api-rest-gateway/Dockerfile
    container_name: api-rest-gateway
    environment:
      - USER-BASE_ENDPOINT=user-base-service:50051
      - FRIEND-REQUEST-BASE_ENDPOINT=friend-request-base-service:50052
      - AUTH-BASE_ENDPOINT=auth-base-service:50053
    ports:
      - "50053:8080"
    depends_on:
      - user-base-service
      - friend-request-base-service

  user-base-service:
    build:
      context: .
      dockerfile: services/user-base/Dockerfile
    container_name: user-base-service
    ports:
      - "50051:50051"
    secrets:
      - db-password
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=database
      - POSTGRES_SERVICE=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  friend-request-base-service:
    build:
      context: .
      dockerfile: services/friend-request-base/Dockerfile
    container_name: friend-request-base-service
    ports:
      - "50052:50052"
    secrets:
      - db-password
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=database
      - POSTGRES_SERVICE=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  auth-base-service:
    build:
      context: .
      dockerfile: services/auth-base/Dockerfile
    container_name: auth-base-service
    environment:
      - USER-BASE_ENDPOINT=user-base-service:50051
    ports:
      - "50055:50053"
    depends_on:
      - user-base-service

  db:
    image: postgres:16-alpine
    restart: always
    container_name: db
    secrets:
      - db-password
    volumes:
      - ./db/init-scripts:/docker-entrypoint-initdb.d
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=database
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  dbgate:
    image: dbgate/dbgate
    container_name: dbgate_ui
    restart: always
    ports:
      - "8080:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - dbgate_data:/root/.dbgate
  
volumes:
  db-data:
  dbgate_data:


secrets:
  db-password:
    file: db/password.txt
